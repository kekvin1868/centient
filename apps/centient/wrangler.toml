name = "cts"
main = "src/index.ts"
compatibility_date = "2026-06-01"

[assets]
directory = "./web"

[[d1_databases]]
binding = "DB"
database_name = "centsdb"
database_id = "00000000-0000-0000-0000-000000000000" # replace with `wrangler d1 create centsdb` output before deploying
migrations_dir = "migrations"

# Production identity: set these once Cloudflare Access protects the hostname.
# [vars]
# ACCESS_TEAM_DOMAIN = "yourteam.cloudflareaccess.com"
# ACCESS_AUD = "<application audience tag>"
# SERVICE_TOKEN_EMAIL = "you@example.com"
