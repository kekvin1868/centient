# Every PR and every push to main: format, types, lint, unit tests, then the e2e suite in Chromium and WebKit.
# Free on a public repo (GitHub-hosted Linux). The Playwright report (with traces of retried tests) is kept 14 days.
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      # The e2e server signs in as the dev user, like `npm run dev` on your machine (.dev.vars is gitignored).
      - run: cp apps/centient/.dev.vars.example apps/centient/.dev.vars
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
