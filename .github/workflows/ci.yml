# Only on a PR labelled `ci` (adding the label runs it; then every push to that PR), or by hand from the Actions
# tab (Run workflow). Otherwise check locally before a PR: `npm run check`, the same steps.
# Format, types, lint, unit tests, then the e2e suite in Chromium and WebKit. The Playwright report (with traces of
# retried tests) is kept 14 days.
name: CI
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
jobs:
  check:
    # Adding some other label to a `ci` PR doesn't run it again.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    # On the job, so a skipped run (no label) never cancels a real one.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      # The e2e server signs in as the dev user, like `npm run dev` on your machine (.dev.vars is gitignored).
      - run: cp apps/centient/.dev.vars.example apps/centient/.dev.vars
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
